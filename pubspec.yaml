name: follo_cart
description: A map-first food cart discovery and follow app.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.0.0
  crypto: ^3.0.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
